<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VeloProve Recorder</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 12px;
        width: 260px;
        color: #111;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #555;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        margin-bottom: 8px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f5f5;
        cursor: pointer;
      }
      button.primary {
        background: #4f8cff;
        border-color: #4f8cff;
        color: #fff;
        font-weight: 600;
      }
      #status {
        font-size: 11px;
        color: #666;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <h1>VeloProve Recorder</h1>
    <p>Interact with the page, then dump JSON for the Dashboard Recorder.</p>
    <button class="primary" id="btnDump">Dump &amp; Copy JSON</button>
    <button id="btnCount">Show step count</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
